# Servidor WEB (capa de presentación) para Riego Virú.
# - Sirve el Angular compilado (dist/viru-frontend/browser).
# - Reenvía /api al servidor APP (Spring Boot). Así el navegador nunca habla directo con APP
#   ni con DATOS: WEB -> APP -> DATOS (la misma política que se demuestra con SDN).
# Cambiar APP_IP por la IP privada del servidor de aplicación y las rutas de los certificados.

upstream viru_app {
    server APP_IP:8080;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/viru.crt;
    ssl_certificate_key /etc/nginx/certs/viru.key;

    root /var/www/viru-frontend;
    index index.html;

    # Rutas de Angular (/login, /admin, /agricultor): siempre se responde index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lecturas en vivo (Server-Sent Events): sin buffer y con conexión larga
    location /api/admin/stream {
        proxy_pass http://viru_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Resto de la API REST
    location /api/ {
        proxy_pass http://viru_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
